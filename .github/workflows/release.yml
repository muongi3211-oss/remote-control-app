name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nhập tên phiên bản (Ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies & Build EXE
      run: |
        cd server
        pip install pyinstaller -r requirements.txt
        pyinstaller --noconsole --onefile server.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: server-exe
        path: server/dist/server.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5 & Build APK
      run: |
        cd android
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download EXE Artifact
      uses: actions/download-artifact@v4
      with:
        name: server-exe
        path: ./release-files

    - name: Download APK Artifact
      uses: actions/download-artifact@v4
      with:
        name: android-apk
        path: ./release-files

    - name: Create GitHub Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        files: |
          ./release-files/server.exe
          ./release-files/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
